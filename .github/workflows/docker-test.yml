name: Build Docker test image

on:
  push:
    branches:
      - feat/outbound-ech-h3
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - danmu_api/**
      - outbound/**
      - config/.env.example
      - .github/workflows/docker-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'lilixu3/danmu_api'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and push test tags only
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/danmu-api:test
            ${{ secrets.DOCKER_USERNAME }}/danmu-api:test-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=danmu-outbound-test
          cache-to: type=gha,mode=max,scope=danmu-outbound-test
      - name: Save image reference for deployment verification
        env:
          TEST_IMAGE: ${{ secrets.DOCKER_USERNAME }}/danmu-api:test-${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          with open('docker-test-image.json', 'w') as output:
              json.dump({
                  'image': os.environ['TEST_IMAGE'],
                  'digest': os.environ['IMAGE_DIGEST'],
                  'commit': os.environ['GITHUB_SHA'],
                  'platforms': ['linux/amd64', 'linux/arm64'],
              }, output)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: docker-test-image
          path: docker-test-image.json
          retention-days: 14
